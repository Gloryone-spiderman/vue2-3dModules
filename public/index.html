<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 引入reset.css重置样式表 -->
    <!-- X-UA-Compatible是为了兼容IE浏览器，设置为IE=edge表示使用最新的IE引擎渲染页面-->
    <!-- viewport是为了适配移动端设备，设置为width=device-width, initial-scale=1.0表示初始缩放比例为100%-->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">       
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D模型项目</title>
</head>
<body>
    <div id="app"></div>
</body>
</html>
